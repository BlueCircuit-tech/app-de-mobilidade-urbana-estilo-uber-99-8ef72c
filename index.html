<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VaiBem — Mobilidade Urbana</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        marca: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            200: '#a7f3d0',
                            300: '#6ee7b7',
                            400: '#34d399',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                            900: '#064e3b',
                        },
                        escuro: {
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            200: '#e2e8f0',
                            300: '#cbd5e1',
                            400: '#94a3b8',
                            500: '#64748b',
                            600: '#475569',
                            700: '#334155',
                            800: '#1e293b',
                            900: '#0f172a',
                            950: '#020617',
                        },
                        accent: {
                            DEFAULT: '#f59e0b',
                            light: '#fbbf24',
                            dark: '#d97706',
                        }
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f1f5f9;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
        }

        #app-frame {
            max-width: 375px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            background: #f8fafc;
            box-shadow: 0 0 40px rgba(0,0,0,0.08);
        }

        .tela {
            display: none;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .nav-item {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-item:hover {
            transform: translateY(-2px);
        }

        .nav-item.ativo {
            color: #059669;
            position: relative;
        }

        .nav-item.ativo::before {
            content: '';
            position: absolute;
            top: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 3px;
            background: #059669;
            border-radius: 0 0 4px 4px;
        }

        .nav-item:not(.ativo) {
            color: #94a3b8;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.5s ease-out forwards;
        }

        .animate-float {
            animation: float 3s ease-in-out infinite;
        }

        .btn-marca {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            color: white;
            font-weight: 600;
            border-radius: 14px;
            padding: 14px 24px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(5, 150, 105, 0.3);
        }

        .btn-marca:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(5, 150, 105, 0.4);
        }

        .btn-marca:active {
            transform: translateY(0);
        }

        .card-touch {
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .card-touch:hover {
            transform: scale(1.01);
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
        }

        .card-touch:active {
            transform: scale(0.98);
        }

        .pulse-dot::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: #10b981;
            animation: pulse-ring 1.5s ease-out infinite;
            z-index: -1;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            transition: all 0.2s ease;
            background: white;
            color: #1e293b;
        }

        .input-field:focus {
            outline: none;
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        }

        .input-field::placeholder {
            color: #94a3b8;
        }
    </style>
</head>
<body class="bg-gray-200">
    <div id="app-frame">
        <!-- Navegação Inferior (estilo app mobile) -->
        <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[375px] z-50 bg-white border-t border-gray-100" style="padding-bottom: env(safe-area-inset-bottom);">
            <div class="flex items-center justify-around py-2 px-2">
                <button class="nav-item ativo flex flex-col items-center gap-0.5 px-2 py-1 rounded-xl"
                        data-nav="onboarding-splash-com-identidade-visual"
                        onclick="mostrarTela('onboarding-splash-com-identidade-visual')">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"/>
                    </svg>
                    <span class="text-[10px] font-medium leading-none">Início</span>
                </button>

                <button class="nav-item flex flex-col items-center gap-0.5 px-2 py-1 rounded-xl"
                        data-nav="login-cadastro"
                        onclick="mostrarTela('login-cadastro')">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.25h15a1.5 1.5 0 001.5-1.5V18a5.25 5.25 0 00-10.5 0v.75a1.5 1.5 0 01-1.5 1.5H4.5z"/>
                    </svg>
                    <span class="text-[10px] font-medium leading-none">Entrar</span>
                </button>

                <button class="nav-item flex flex-col items-center gap-0.5 px-2 py-1 rounded-xl"
                        data-nav="home-do-passageiro-solicitar-corrida"
                        onclick="mostrarTela('home-do-passageiro-solicitar-corrida')">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z"/>
                    </svg>
                    <span class="text-[10px] font-medium leading-none">Corrida</span>
                </button>

                <button class="nav-item flex flex-col items-center gap-0.5 px-2 py-1 rounded-xl"
                        data-nav="escolha-de-categoria-e-confirmacao"
                        onclick="mostrarTela('escolha-de-categoria-e-confirmacao')">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>
                    </svg>
                    <span class="text-[10px] font-medium leading-none">Escolher</span>
                </button>

                <button class="nav-item flex flex-col items-center gap-0.5 px-2 py-1 rounded-xl"
                        data-nav="buscando-acompanhamento-no-mapa"
                        onclick="mostrarTela('buscando-acompanhamento-no-mapa')">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 6.75V15m6-6v8.25m.503 3.498l4.875-2.437c.381-.19.622-.58.622-1.006V4.82c0-.836-.88-1.38-1.628-1.006l-3.869 1.934c-.317.159-.69.159-1.006 0L9.503 3.252a1.125 1.125 0 00-1.006 0L3.622 5.689C3.24 5.88 3 6.27 3 6.695V19.18c0 .836.88 1.38 1.628 1.006l3.869-1.934c.317-.159.69-.159 1.006 0l4.994 2.497c.317.158.69.158 1.006 0z"/>
                    </svg>
                    <span class="text-[10px] font-medium leading-none">Mapa</span>
                </button>

                <button class="nav-item flex flex-col items-center gap-0.5 px-2 py-1 rounded-xl"
                        data-nav="chat-passageiro-motorista"
                        onclick="mostrarTela('chat-passageiro-motorista')">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8.625 12a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H8.25m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H12m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0h-.375M21 12c0 4.556-3.88 8.25-8.673 8.25S3.654 16.556 3.654 12 7.534 3.75 12 3.75s8.673 3.69 8.673 8.25z"/>
                    </svg>
                    <span class="text-[10px] font-medium leading-none">Chat</span>
                </button>
            </div>
        </nav>

        <!-- Conteúdo principal — telas são injetadas aqui -->
        <main>
            <!-- TELAS -->
        </main>
    </div>

    <script>
        function mostrarTela(id) {
            document.querySelectorAll('[data-tela]').forEach(function (s) {
                s.classList.toggle('hidden', s.dataset.tela !== id);
            });
            document.querySelectorAll('[data-nav]').forEach(function (b) {
                b.classList.toggle('ativo', b.dataset.nav === id);
            });
            window.scrollTo({ top: 0 });
        }

        document.addEventListener('DOMContentLoaded', function () {
            mostrarTela('onboarding-splash-com-identidade-visual');
        });
    </script>
</body>
</html>
